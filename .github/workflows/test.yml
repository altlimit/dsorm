name: Test

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Must run before docker compose. The backend service bind-mounts the host
    # module cache, and Docker creates a missing bind-mount source directory as
    # root — leaving $GOMODCACHE unwritable for the later `go test` step
    # ("mkdir /home/runner/go/pkg/mod/cache: permission denied"). Downloading
    # first creates it as the runner user, and also populates the cache the
    # backend container needs, since it builds with GOPROXY=off.
    - name: Download modules
      run: go mod download

    - name: Start Services
      run: |
        cd test
        docker compose up -d

    - name: Wait for services
      run: sleep 10

    - name: Run Tests
      env:
        DATASTORE_EMULATOR_HOST: localhost:8081
        DATASTORE_PROJECT_ID: app-test
      run: go test -v ./...

    - name: Stop Services
      if: always()
      run: |
        cd test
        docker compose down